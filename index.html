<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Box</title><style>body{font-family:system-ui;max-width:850px;margin:40px auto;padding:0 18px;background:#111;color:#eee}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid #444;border-radius:12px;padding:16px}.v{font-size:1.7rem;font-weight:700}.note{color:#aaa}h1{margin-bottom:4px}</style></head><body><h1>Science Box for Mars</h1><p class="note">Local dashboard concept — populate values from ESP8266 serial/HTTP bridge.</p><div class="grid"><div class="card">Stage<div class="v" id="stage">READY</div></div><div class="card">Temperature<div class="v" id="temp">-- °C</div></div><div class="card">Humidity<div class="v" id="hum">-- %</div></div><div class="card">Soil moisture<div class="v" id="moist">--</div></div><div class="card">pH<div class="v" id="ph">--</div></div><div class="card">Nitrate channel<div class="v" id="nitrate">--</div></div><div class="card">Salt/perchlorate screen<div class="v" id="salt">--</div></div><div class="card">Habitability potential<div class="v" id="hab">--</div></div></div><p class="note">Screening result only; not evidence of detected life.</p></body></html>
